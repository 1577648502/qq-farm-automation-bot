syntax = "proto3";

package gamepb.sharepb;

import "corepb.proto";

// ============ 分享服务 ============

// --- 检查是否可以分享 ---
message CheckCanShareRequest {}

message CheckCanShareReply {
    bool can_share = 1;  // 是否可以分享
}

// --- 报告分享 ---
// 抓包(2026-09-01): 请求 { #1=15, #4=1506 } (旧活动期)
// 抓包(2026-09-09) + 用户确认入口语义:
//   { #1=1, #4=42 } = 游戏内【每日分享任务】, 上报后走 ClaimShareReward 领奖
//   { #1=1, #4=0 }  = 微信游戏礼包入口 (每日可领, 另有周末档), 上报即得、无需领奖
//   旧参数与空请求体均已失效, 服务端报 1000020 请求参数错误
message ReportShareRequest {
    int64 share_type = 1;   // 分享场景类型 (2026-09-09 实测=1)
    int64 scene = 4;        // 分享入口: 42=每日分享任务, 0=微信游戏礼包
}

message ReportShareReply {
    ReportShareResult result = 1;
}

message ReportShareResult {
    int64 code = 1;                 // 实测=1 (成功)
    ReportShareReward reward = 2;
}

message ReportShareReward {
    int64 field1 = 1;
    int64 field2 = 2;
}

// --- 领取分享奖励 ---
// 抓包(2026-09-09): ReportShare 成功后客户端随即调用
//   请求 { #1=1 }(share_type); 响应 field1=奖励信息, field2=状态
message ClaimShareRewardRequest {
    int64 share_type = 1;   // 实测=1
}

message ClaimShareRewardReply {
    ClaimShareRewardInfo reward = 1;   // 奖励信息
    ClaimShareRewardStatus status = 2; // 状态
}

message ClaimShareRewardInfo {
    int64 field1 = 1;   // 实测=100003 (疑似奖励/任务id)
    int64 field2 = 2;   // 实测=5
    int64 field3 = 3;   // 实测=负数 int64
    int64 field6 = 6;   // 实测=11362 (疑似物品id)
    int64 field7 = 7;   // 实测=1 (疑似数量)
}

message ClaimShareRewardStatus {
    int64 field1 = 1;
    ClaimShareRewardStatusInner field2 = 2;
}

message ClaimShareRewardStatusInner {
    int64 field1 = 1;
    int64 field2 = 2;
}
