// ============================================================================
// 夺宝(抢宝) —— 实测于 2026-09-17 抓包 (活动 id=2026090101, group=2026090100, 名称 "S3 萌宠")
//
// 完整流程(客户端实际行为, 每步都有抓包证据):
//   1) FriendService.GetGameFriends                    刷新好友列表
//      每个 GameFriend 带 field 18 = {1: 2026090100(活动组id), 2: 1} —— 标记该好友参与了夺宝活动
//      (注意: 所有参与活动的好友都有这个字段, 不是"正在运送"的判据)
//   2) Operate cmd=47 + field147 { gid }               查这个好友有哪些可夺宝藏
//      响应根层 field147 -> 147.list.treasures[] 即宝藏列表; 列表非空 = 有宝可夺
//
// ⚠️ 两个实测坑 (2026-09-17 线上验证, 务必遵守):
//   (1) cmd=47 响应末尾有 1~10 字节"脏尾": protobufjs 整包 decode 必报
//       "invalid wire type 6 at offset <bodyLen>" 或 "index out of range: N + k > N"。
//       => 不要整包 decode; 按字段扫描, 越界/非法 wire 就停止
//          (见 services/treasure-rob.js 的 scanFields / parseTreasureList)。
//   (2) 宝藏列表在 #147 的 #1(包装层) 里的 repeated #1[], 即比"直接 repeated"多一层。
//   3) Operate cmd=43 + field143 { gid, treasure_id, book_item_id }   用挑战书发起夺宝
//   4) 服务端下发 ItemNotify: 挑战书 delta=-1(消耗) + 幸运星(1029)增加
//   5) ActiviesChangeNotify + 再次 cmd=47 刷新宝藏价值(每次成功后可夺价值被扣减)
//
// 挑战书 item id (来自 gameConfig/ItemInfo.json, type=19 "夺宝道具"):
//   80101 初级挑战书  价值100  胜+120  败返还80
//   80102 中级挑战书  价值300  胜+450  败返还150
//   80103 高级挑战书  价值700  胜+1260 败返还140
// ============================================================================

// --- cmd=47: 查询指定好友的夺宝列表 ---
message TreasureHuntQueryReq {
    int64 gid = 1;            // 实测: 好友 gid (与 GetGameFriends 的 #1 一致)
}

message TreasureHuntQueryRsp {
    TreasureHuntList list = 1;   // 实测: 多一层包装(不是直接 repeated)
    int64 gid = 2;               // 实测: 回显请求的好友 gid
}

message TreasureHuntList {
    repeated TreasureInfo treasures = 1;   // 实测: 该好友当前可夺的宝藏(挑战后再次查询会看到价值被扣减)
    bytes field2 = 2;                      // 实测 1B, 语义待确认
}

// 单个宝藏
message TreasureInfo {
    string treasure_id = 1;      // 实测形如 "1004896646-1789598933572389645-cc8db275" (好友gid-雪花号-8位hex), 挑战时原样回填
    int64 settle_item_id = 2;    // 实测 1029 (= 幸运星 item id), 疑似结算币种
    int64 stealable_value = 3;   // 实测 350 → 140 → 130: 可被夺走的价值, **每次夺宝成功后会被扣减**
    int64 start_time = 4;        // 实测 unix 秒, 宝藏开始时间
    int64 status = 5;            // 实测 2 = 运送中(本次挑战的目标都是 2) / 3 = 另一个宝藏为 3, 语义待确认
    int64 end_time = 6;          // 实测 unix 秒, 护送截止时间
    int64 field7 = 7;            // 实测与 start_time 或 end_time 相同, 待确认
    int64 max_value = 8;         // 实测 350 = 价值上限
    int64 bonus_value = 9;       // 实测 50 = 增值部分(活动说明: 增值部分不可被掠夺)
    int64 field10 = 10;          // 实测 2000
    repeated TreasureBookSlot book_slots = 12;  // 按挑战书档位给出的"这刀能夺到多少"
    int64 field13 = 13;          // 实测 3 → 1 → 2 → 2, 语义待确认(疑似剩余可夺次数)
    int64 field14 = 14;          // 实测 3
}

// 某个挑战书档位对应的结算信息 (2026-09-18 补全: 服务端直接下发胜/败金额!)
message TreasureBookSlot {
    string treasure_id = 1;      // 同 TreasureInfo.treasure_id
    int64 book_item_id = 2;      // 80101 / 80102 / 80103
    int64 field3 = 3;            // 实测: 首次=1(空 msg 时), 语义待确认
    ItemAmount win_amount = 4;   // 实测 初级{1029,60} 中级{1029,225} 高级{1029,510}: 该档胜利可获得
    ItemAmount lose_amount = 5;  // 实测 初级{1029,40} 中级{1029,75} 高级{1029,90}: 该档失败可返还
    int64 gold = 6;              // 实测 300: 该宝藏当前**可博弈资金**(#3 价值 - #9 保底), 各档相同;
                                 //   挑战书面值 > 它会被服务端拒绝("当前宝藏资金不足")
}

// --- cmd=43: 发起夺宝挑战(消耗一张挑战书) ---
message TreasureHuntChallengeReq {
    int64 gid = 1;               // 实测: 目标好友 gid
    string treasure_id = 2;      // 实测: 来自 cmd=47 响应, 原样回填(字符串, 不是 message!)
    int64 book_item_id = 3;      // 实测: 80103 高级 / 80101 初级 / 80102 中级 —— 就是"用哪张挑战书"
}

// --- 秋祈良愿 (2026-09-24 新活动, group=2026092401, 子ID 2026092400) ---
// 规则: 9/24–10/7 每日祈愿领奖励(限定种子/烟花互动道具/盆栽装扮), 可存 5 日, 漏领走邮件补发
// 实测: cmd=51(祈愿) → 结果 #151 = {#1: 签文号, #2: 1, #3: 奖励{物品ID,数量}}
//       cmd=52(领取) → 结果 #152 = {#1: 奖励{...}}  → 紧跟 ItemNotify 实际到账
//       活动体里的 #119 内部有 #1 = 有可领奖励(领完 #1 消失但 #119 仍在!), 活动头 #23 = 1 同为待领标记
//       上行 payload 加密未见 → 服务实现用空 payload 试发 + 响应/状态双重校验
message AutumnWishOperateReq {
    // 字段号 = cmd + 100 (实测): 151 / 152
}

message AutumnWishOperateRsp {
    // #151 / #152 = { #1: { #1: 物品ID, #2: 数量 } }
    corepb.Item reward = 1;
}

// --- 快乐不独享 (2026-09-24 新活动, group=2026092501, 子ID 2026092500) ---
// 规则: 9/24–10/12 攒快乐值(每日主界面领取 / 每日首次分享 / 点好友快乐包) → 领档位奖励
// 实测(20260924-203415 抓包):
//   cmd=69(打开)     → 结果 #153 = {#1:{我的gid, hash, shareKey, #5:{#1: group, #2: 快乐包id}}}
//   cmd=73(领快乐值) → 结果 #157 = {#2: 5}          ← 快乐值 5 → 10
//   cmd=70(领档位)   → 结果 #154 = {#2:{物品ID,数量}} ← 实际领到 化肥(4小时)×1
//   cmd=71(快乐包记录) → 结果 #155 = 若干 {#6: 快乐包id}
//   活动体 #120.#1: #2=快乐值, #5(repeated)=档位{#1:档位,#2:门槛,#3:{物品,数量},#4:状态}
//                   **#4: 1=未达成 2=可领 3=已领**
//   实测门槛/奖励: 10→化肥(4小时) · 20→有机化肥(8小时) · 30→点券×50 · 60→90042
//   ⚠ 结果字段不是 cmd+100, 是本活动自己的登记 153/154/155/157
message HappyShareOperateReq {
    // 字段号见上: 153 / 154 / 155 / 157(均空 payload)
}

message HappyShareOperateRsp {
    corepb.Item reward = 1;
}

// --- cmd=45: 领取护送结算奖励 (2026-09-18) ---
// 护送结束(到期/被夺满 3 次/爆仓)后宝藏资金要主动领取; 客户端打开活动页时自动领一次。
// 实测: 响应 #145 = { #1: { #1: 1029, #2: 690 } }, 幸运星 +690 = 两条已结束护送的价值(350+340)
message TreasureHuntSettleReq {
}

message TreasureHuntSettleRsp {
    ItemAmount reward = 1;   // 实测 {1: 1029, 2: 690}
}

// --- cmd=50: 查我的夺宝状态 (请求体 {1:1}) ---
message TreasureHuntMiscReq {
    int64 field1 = 1;            // 实测 = 1
}

message TreasureHuntMiscRsp {
    int64 field1 = 1;            // 实测 = 1 (回显)
}

// --- cmd=43: 发起夺宝挑战的响应 = 战报 ---
// 抓包实测 3 帧(2026-09-17, 见 services/treasure-rob.js):
//   夺得: { #1: 1, #2: {1029, 510}, #3: "Kamiya Bunches", #6: 对手结算, #7: 4, #8: 3, #9: 对战详情 }
//   被拒: { #10: 1, #12: "当前宝藏资金不足，无法使用该挑战书" }  ← err=0, 战斗没打起来, 必须读 #12
// 奖励已交叉验证: 夺宝前后幸运星(#115.#3.#3) 2050 → 2560 → 2620, 与 #2 的 +510/+60 完全一致。
// ⚠ 服务端在 proto 里只声明到 #150, 本响应是**未声明字段**; treasure-rob.js 用字段扫描读取,
//   不要依赖整包 decode(见下方 TreasureHuntQueryRsp 的脏尾说明)。
message TreasureHuntChallengeRsp {
    // ⚠ 09-18 实测: **落败时 #1 和 #2 都不下发**(只剩 #3/#6/#9) —— 判定落败要按"有战报主体但无 #1"
    int64 result = 1;                 // 实测 1 = 夺得(攻方胜); 落败时整个字段缺省
    ItemAmount reward = 2;            // 实测 {1: 1029 幸运星, 2: 510}: 胜利时到账奖励; 落败时缺省
    string opponent_name = 3;         // 实测 "Kamiya Bunches": 对手昵称
    ItemAmount opponent_settle = 6;   // 实测 = 我方本次到账金额(胜=赢得/败=返还), 与 ItemNotify 增量一致
    int64 field7 = 7;                 // 实测 4 → 6, 语义待确认
    int64 field8 = 8;                 // 实测 3 → 4, 语义待确认
    TreasureHuntBattle battle = 9;    // 对战详情
    int64 reject_flag = 10;           // 被拒时 = 1
    string reject_text = 12;          // 被拒原因文案
}

message TreasureHuntBattle {
    string my_charm = 1;              // 实测 "e" = 101 惜糕探宝: 我方锦囊(单字节 charm_id)
    string their_charm = 2;           // 实测 "g" = 103 复仇机制: 对方锦囊
    TreasureHuntStake stake = 4;      // 双方投入(规则: 双方投入等额博弈资金)
    TreasureHuntRate rate = 5;        // 双方胜率
}

message TreasureHuntStake {
    ItemAmount mine = 1;
    ItemAmount theirs = 2;
}

message TreasureHuntRate {
    double mine = 1;                  // 实测 0.5 (fixed64)
    double theirs = 2;                // 实测 0.5
}

// 夺宝活动 body: 实测挂在 ActivityData field 115 (三次 cmd=43 响应内容一致, 是"我的夺宝状态")
message ActivityBodyTreasureHunt {
    MyTreasure mine = 1;             // 实测 {1:1, 3:7000, 4:2, 5:1789614882, 6:1}: 我正在护送的宝藏
    TreasureHuntCounter counter = 2; // 实测 {1:10}: 疑似今日剩余次数
    TreasureHuntBalance balance = 3; // 实测 {3: 幸运星数, 4:{item_id:1028, count:630}, 5:1}
    repeated TreasureHuntReport reports = 4;  // 实测 390B / 8 条: 夺宝战报(带 photo JSON)
    int64 field5 = 5;
    TreasureHuntExtra extra = 6;     // 实测 {2:"e", 4:{...}, 6:1, 9:1}
    bytes field7 = 7;
    bytes field8 = 8;
    bytes field9 = 9;
}

message MyTreasure {
    int64 field1 = 1;   // 实测 1
    int64 value = 3;    // 实测 7000
    int64 field4 = 4;   // 实测 2
    int64 field5 = 5;   // 实测 unix 秒
    int64 field6 = 6;   // 实测 1
}

message TreasureHuntCounter {
    int64 field1 = 1;   // 实测 10
}

message TreasureHuntBalance {
    int64 field3 = 3;   // 实测 2050 → 2560: 幸运星数量
    ItemAmount field4 = 4;  // 实测 {1:1028(item id), 2:630(count)}
    int64 field5 = 5;   // 实测 1
}

message ItemAmount {
    int64 item_id = 1;
    int64 count = 2;
}

message TreasureHuntReport {
    bytes field1 = 1;   // 实测 180B/176B/2B...: 首条含 {"photo": "gui/texture/Season/S3/S3PhotoWallPhotos/..."}
}

message TreasureHuntExtra {
    string field2 = 2;  // 实测 "e"
    bytes field4 = 4;
    int64 field6 = 6;
    int64 field9 = 9;
}
