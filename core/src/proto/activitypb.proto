syntax = "proto3";

package gamepb.activitypb;

import "corepb.proto";

message ListRequest {}

message ListReply {
    repeated ActivityGroup groups = 1;
    repeated ActivitySummary all_activities = 2;
}

message GetGroupRequest {
    int64 group_id = 1;
}

message GetGroupReply {
    ActivityGroup group = 1;
}

message SetSplashedRequest {
    int64 id = 1;
}

message SetSplashedReply {}

message ActivityGroup {
    ActivityHead head = 1;
    repeated ActivityData children = 2;
}

message ActivityHead {
    int64 id = 1;
    int64 group_id = 2;
    int64 type = 3;
    string name = 4;
    string desc = 5;
    int64 start_time = 6;
    int64 end_time = 7;
    int64 client_id = 8;
    int32 status = 20;
    int64 splash_order = 21;
    bool splashed = 22;
    bool has_red_dot = 23;
}

message ActivityData {
    ActivityHead head = 1;
    ActivityBodyEmpty empty = 100;
    ActivityBodyRandShop rand_shop = 101;
    ActivityBodyShop shop = 102;
    ActivityBodyDailySignin daily_signin = 103;
    ActivityBodyDraw draw = 104;
    ActivityBodyLottery lottery = 105;
    ActivityBodyEmpty qqgroup = 106;
    ActivityBodyCampCheer camp_cheer = 107;
    ActivityBodyQingmei qingmei = 108;
    ActivityBodyStarRegister star_register = 110;
}

// ============ 观星礼录 (星宿活动, head.type=13) ============
// 实测字段布局 (2026-07 抓包, 活动「心许千灯星垂野/千星同明」, uid=SAIJI_MEGA_EVENT):
//   Operate cmd=21 为查询, 响应 activity 里 field 110 即本 body。
//   rewards(4) 共28条=28星宿每日奖励; stars(5) 共28条=星宿信息(角宿/亢宿...)。
//   实测第1天 unlocked=1 且 claimed=1, 其余天两标志均为0(未开放),
//   两标志语义按活动说明推断(每日开放后可领取), 领取RPC尚未抓到。
message ActivityBodyStarRegister {
    int64 field1 = 1;   // 实测=1 (疑似当前已点亮天数, 未确认)
    int64 field2 = 2;   // 实测=30 (疑似活动总天数, 未确认)
    repeated StarDailyReward rewards = 4;
    repeated StarInfo stars = 5;
}

message StarDailyReward {
    int64 day = 1;                    // 1-28
    bool unlocked = 2;
    bool claimed = 3;
    repeated corepb.Item items = 5;   // 当日奖励
}

message StarInfo {
    int64 day = 1;
    int64 field2 = 2;    // 实测=1, 未确认
    string name = 3;     // 星宿名(角宿/亢宿...)
    string events = 4;   // 实测形如 "0;0:1;1:0;..." 的编码串
    string extra = 5;    // JSON: {"category":"青龙","explain":"..."}
}

message ActivityBodyEmpty {}
message ActivityBodyRandShop {}
message ActivityBodyCampCheer {}

message ActivityBodyShop {
    repeated ShopGoodsInfo goods = 1;
}

message ShopGoodsInfo {
    int64 id = 1;
    repeated ShopItemInfo item = 2;
    repeated ShopItemInfo cost = 3;
    int64 purchase_limit = 4;
    int64 purchased_count = 5;
    int64 order = 6;
    string name = 7;
    string desc = 8;
    int64 diamond_cost_count = 9;
    int64 background_type = 10;
    int64 restriction_type = 11;
}

message ShopItemInfo {
    int64 id = 1;
    int64 count = 2;
}

message ShopBuyReq {
    int64 goods_id = 1;
    int64 count = 2;
}

message ShopBuyRsp {
    repeated corepb.Item awards = 1;
    repeated corepb.Item costs = 2;
}

message RandShopBuyReq {
    int64 goods_id = 1;
    int64 count = 2;
}

message RandShopBatchBuyReq {}

message RandShopBuyRsp {
    repeated corepb.Item awards = 1;
    repeated corepb.Item costs = 2;
