syntax = "proto3";

package gamepb.itempb;

import "corepb.proto";

// ============ 背包/仓库 ============

// 获取背包
message BagRequest {}

message BagReply {
    corepb.ItemBag item_bag = 1;  // 与 game 一致，背包数据在 item_bag 里
}

// ============ 出售物品 ============

message SellRequest {
    repeated corepb.Item items = 1;  // 要出售的物品列表 (id + count)
    // 抓包实测(20261116/17): 客户端恒发 #8 = 空字符串(42 00)。
    // 缺失时服务端对牧场产物返回 1000020 请求参数错误。
    string scene_tag = 8;
}

message SellReply {
    repeated corepb.Item sell_items = 1;  // 出售的物品
    repeated corepb.Item get_items = 2;   // 获得的物品（常见: 1001=金币, 1002=点券）
}

// ============ 使用物品 ============

message UseRequest {
    int64 item_id = 1;
    int64 count = 2;
    repeated int64 land_ids = 3;
}

message UseReply {
    repeated corepb.Item items = 1;
}

// ============ 批量使用物品 ============

message BatchUseRequest {
    repeated corepb.Item items = 1;
}

message BatchUseReply {
    repeated corepb.Item used_items = 1;
    repeated corepb.Item items = 2;
}

// --- 牧场背包(2026-11-17 实测, 见 docs/mc-ranch/牧场仓库功能文档) ---
// 牧场背包是独立的一套: ItemService.Bag 返回农场背包(牧场物为 0),
// GetBag{global_scene_id:2} 才是牧场仓库(牧草/幼崽/便便/罐头都在这里)。
message GetBagTabRequest {
    int64 global_scene_id = 1;   // 2 = 牧场(大农场)
}
message GetBagTabReply {
    repeated BagTab tabs = 1;
    int64 global_scene_id = 2;
}
message BagTab {
    int64 id = 1;
    string name = 2;
    int64 capacity = 3;
    int64 field4 = 4;
    bool has_red_dot = 5;
}
message GetBagRequest {
    int64 global_scene_id = 1;   // 2 = 牧场
    int64 tab_id = 2;            // 0 = 全部
}
message GetBagReply {
    // 实测(20261117) 顶层: #1=物品(repeated) #2=虚拟货币(repeated) #3=容量 #4=已用 #5=tab
    repeated corepb.Item items = 1;
    repeated corepb.Item virtual_items = 2;
    int64 capacity = 3;          // 210
    int64 used = 4;              // 9
    int64 tab_id = 5;
}
