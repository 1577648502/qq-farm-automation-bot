syntax = "proto3";

package gamepb.shoppb;

import "corepb.proto";

// ============ 商店类型: 1=道具商店, 2=种子商店, 3=宠物商店 ============

// ============ 商店概览 ============
message ShopProfile {
    int64 shop_id = 1;      // 商店ID
    string shop_name = 2;   // 商店名称
    int32 shop_type = 3;    // 商店类型
}

// ============ 商品信息 ============
message GoodsInfo {
    int64 id = 1;              // 商品ID (用于购买)
    int64 bought_num = 2;      // 已购买数量
    int64 price = 3;           // 价格 (金币)
    int64 limit_count = 4;     // 限购数量 (0=不限购)
    bool unlocked = 5;         // 是否已解锁
    int64 item_id = 6;         // 物品ID (即种子ID)
    int64 item_count = 7;      // 每次购买获得数量
    repeated Cond conds = 8;   // 解锁条件
    int64 price_id = 9;        // 货币ID (1001=金币, 1005=金豆豆, 1002=点券, 1004=钻石)
}

// ============ 解锁条件 ============
enum CondType {
    COND_TYPE_UNKNOWN = 0;
    MIN_LEVEL = 1;     // 最低等级要求
    UNLOCK_CARD = 2;   // 需要解锁卡
}

message Cond {
    int32 type = 1;    // CondType
    int64 param = 2;   // 参数值 (如等级要求的等级数)
}

// ============ 请求/回复 ============

// --- 获取商店列表 ---
message ShopProfilesRequest {}

message ShopProfilesReply {
    repeated ShopProfile shop_profiles = 1;
}

// --- 获取商店商品 ---
message ShopInfoRequest {
    int64 shop_id = 1;
}

message ShopInfoReply {
    repeated GoodsInfo goods_list = 1;
}

// --- 购买商品 ---
message BuyGoodsRequest {
    int64 goods_id = 1;   // 商品ID (GoodsInfo.id)
    int64 num = 2;        // 购买数量
    int64 price = 3;      // 单价
    int64 auto_add = 4;   // 20261117 抓包恒 1: 买到幼崽/饲料后自动加入窝棚/牧草机
}

message BuyGoodsReply {
    GoodsInfo goods = 1;                  // 更新后的商品信息
    repeated corepb.Item get_items = 2;   // 获得的物品
    repeated corepb.Item cost_items = 3;  // 消耗的物品
}

// --- 商品解锁推送 ---
message GoodsUnlockNotify {
    repeated GoodsInfo goods_list = 1;
}

// --- 游商(兑换集市, slot 7; 20261117 抓包北栎号) ---
message RotationShopInfoRequest {
    int64 shop_id = 1;               // 抓包恒 7
}
message RotationShopInfoReply {
    // 通用 wire 解析见 ranch.js parseRotationShopReply(结构未完全定 proto 化)
    // 1=营业, 3=刷新时间戳, 5=[分组], 6=[商品]
}

// 游商购买(20261117 16:27:11 实测): {1:uid, 2:数量, 3:刷新时间戳, 4:1}
// uid = RotationShopInfoReply 商品里的 #13(唯一序号); #3 是游商当前刷新时间(秒)
message RotationBuyGoodsRequest {
    int64 uid = 1;
    int64 num = 2;
    int64 refresh_at = 3;
    int64 flag = 4;                  // 抓包恒 1
}
message RotationBuyGoodsReply {
    RotationGoods goods = 1;         // 买到的商品信息
    repeated corepb.Item get_items = 2;   // 获得的物品(响应 #2 {1:80011, 2:1, 6:68342, 7:1})
}
message RotationGoods {
    int64 field1 = 1;
    int64 num = 2;
    int64 item_id = 3;               // 80011
    int64 field4 = 4;
    int64 currency_id = 5;           // 7002 便便
    int64 price = 6;
    int64 field10 = 10;
    int64 field11 = 11;
    LimitText limit_text = 12;       // "最低等级"
    int64 uid = 13;
}
message LimitText {
    string text = 1;
    // 2 未解析
}
