syntax = "proto3";

package gamepb.animalpb;

import "corepb.proto";

// ============ 牧场(11-17 新玩法, 25 级解锁) ============
// ⭐ 字段语义**以官方客户端解码器为准**(2026-11-18 定案):
//   QQ 小程序 1112386029 的牧场分包 mcboot/game.js 里带 protobufjs 生成的
//   encode/decode 实现, 默认字段名 + wire 号 + 类型全都在。
//   路径: ~/Library/Containers/com.tencent.qqexminiprogram/.../miniapp_src/*/subpackages/mcboot/game.js
//   抓包只用来验证取值; 结构一律照抄客户端, 不再"从抓包猜语义"。

// 牧场详情(AnimalService.GetRanchDetail 回包 #1, repeated —— 窝/棚各一个)
//   客户端 wire: #{1:varint 2:varint 3:varint 4:msg 5:msg 6:varint 7:msg 8:msg}
message RanchInfo {
    int64 ranch_inst_id = 1;         // 牧场实例 ID(窝=10001, 棚=10003 …)
    int64 capacity = 2;              // 该栏舍容量(已解锁槽位数)
    int64 animal_count = 3;          // 在养数量
    repeated AnimalInfo animals = 4; // 动物列表
    GrassStorage grass = 5;          // 牧草(实际帧里多为空 msg)
    int64 husbandry_type = 6;        // 1=窝(coop, 小动物) 2=棚(pen, 大动物)
    repeated ShelfInfo shelves = 7;  // 产物架(可收获/可偷)
    repeated HazardInfo hazards = 8; // 待清理(hazard)
}

// 单只动物 — wire 号与官方客户端 AnimalInfo 解码器逐一对齐
message AnimalInfo {
    int64 ranch_inst_id = 1;              // 所属栏舍实例 ID
    int64 slot_index = 2;                 // 槽位 1..N
    int64 animal_inst_id = 3;             // 动物实例 ID
    int64 animal_id = 4;                  // 动物物品 ID(60001 鸡 / 60002 兔子 …)
    int64 stage = 5;                      // 阶段序号(1..5, 见 STAGE 说明; 不是"成熟度 1..6")
    int64 produce_count = 6;              // 本轮可产数量
    bool can_harvest = 7;                 // 可收获(官方权威位)
    // 8,9 未使用
    int64 grow_ready_at_ms = 10;          // 幼崽→成长期就绪时刻(ms)
    int64 produce_ready_at_ms = 11;       // 本次产出就绪时刻(ms; 生产期才有)
    bool grass_blocked = 12;              // 牧草断了(饥饿)
    // 13 未使用
    int64 infant_ready_at_ms = 14;        // 幼崽期结束时刻(ms)
    bool producing = 15;                  // 正在生产
    bool can_deliver = 16;                // 可交付(催产)
    int64 delivering_until_ms = 17;       // 交付倒计时终点(ms; 气泡 labelText 用这个)
    bool can_feed = 18;                   // 可喂食
    bool limited_can_used = 19;           // 普通罐头已用(每只一次)
    bool can_donate = 20;                 // 可出售
    int64 expected_harvest_exp = 21;      // 收获预计经验
    repeated CostInfo expected_harvest_sells = 22; // 收获预计出售所得
    int64 expected_produce_exp = 23;      // 产出预计经验
    repeated CostInfo expected_produce_sells = 24; // 产出预计出售所得
    int64 mature_ready_at_ms = 25;        // 成熟就绪时刻(ms)
    // 26..29 未使用
    MutantInfo mutation = 30;             // 变异信息
}

message GrassStorage {
    int64 grass_count = 1;           // 牧草数量
}

// 产物架(可收获 / 可偷)
message ShelfInfo {
    int64 item_id = 1;               // 产物物品 ID
    int64 base_num = 2;              // 基础数量
    int64 remain_num = 3;            // 剩余可收数量
    int64 stolen_num = 4;            // 已被偷数量
    int64 animal_id = 5;             // 对应动物
    bool can_steal = 6;              // 可偷
    repeated int64 stealers = 7;     // 偷过的 gid(packed/非 packed 两种编码)
}

// 待清理物(蚊子/便便)
message HazardInfo {
    int64 hazard_id = 1;             // 结构待样本确认(客户端 hazard 解码器名不同)
}

message CostInfo {
    int64 item_id = 1;               // 1007 金券
    int64 amount = 2;
}

message MutantInfo {
    // 官方客户端 mutation 结构:
    //   {1:mutation_type 2:source 3:weight_display_x10 4:scale_bp 5:weight_final_x10
    //    6:tier 7:became_at_ms 8:strokable 9+:stroked_gids}
    int64 mutation_type = 1;
    int64 source = 2;
    int64 weight_display_x10 = 3;
    int64 scale_bp = 4;
    int64 weight_final_x10 = 5;
    int64 tier = 6;
    int64 became_at_ms = 7;
    bool strokable = 8;
    repeated int64 stroked_gids = 9;
}

// ============ 服务: gamepb.animalpb.AnimalService / RanchService ============

// --- 牧场详情 ---
// 抓包(20261117): 空消息(自己, 1200) 或 {1:gid, 2:{}}(看好友, 08<gid>1200)
message GetRanchDetailRequest {
    int64 host_gid = 1;              // 看好友牧场时填对方 gid; 自己不发
    HostRef host = 2;                // 看好友时带空 msg({})); 自己不发
}
message GetRanchDetailReply {
    // ⭐ repeated! 窝(husbandry_type=1)和棚(=2)各一条, 实例 10001/10003。
    //   写成单值会让 protobufjs 把两条**合并**成一个, 动物的 slot 还会撞号。
    repeated RanchInfo ranches = 1;
    int64 ranch_exp = 2;             // 牧场经验(实测恒 30, 真实值走物品 1102)
}

// --- 喂食 ---
// 抓包请求: {1:{1:10001, 2:方式}, 2:数量}
//   方式 4/5/6 的确切含义待更多抓包; 响应 #5.#3 与请求 #1.#2 一致,
//   #5.#11{7003/7004=余量} 是被扣的无机/有机罐头桶剩余时长(秒)。
message FeedAnimalRequest {
    FeedTarget target = 1;           // {1: hostGid, 2: animal_inst_id(可省略, 缺省=全场)}
    int64 feed_type = 2;             // ⭐ 喂食方式: 1=有机罐头(扣7004) / 2=普通罐头(扣7003), 不是数量
}
message FeedAnimalReply {
    repeated RanchInfo ranches = 1;
    int64 storage_value = 2;         // 被扣桶的剩余时长(秒; 推断)
    int64 ranch_exp = 4;             // 牧场总经验
    FeedReceipt receipt = 5;         // {1:gid, 2:槽位, 3:喂食方式, 11:{容器ID:余量}}
}
message FeedTarget {
    int64 host_gid = 1;
    int64 animal_inst_id = 2;        // 动物实例 ID(抓包定案, 非 feed_type); 缺省=全场
}
message FeedReceipt {
    int64 host_gid = 1;
    int64 slot = 2;
    int64 feed_type = 3;
    // 4..10 未出现
    ContainerLeft container = 11;    // {7003|7004: 剩余秒数}
}
message ContainerLeft {
    int64 item_id = 1;               // 7003 无机罐头容器 / 7004 有机罐头容器
    int64 seconds = 2;
}

// --- 催产 ---
// 抓包: 空请求 或 {2:{1:10001, 2:槽位}}; 槽位 1 起
message TriggerProduceRequest {
    // 1 未出现
    ProduceTarget target = 2;        // 只在指定槽位时出现
}
message ProduceTarget {
    int64 host_gid = 1;
    int64 slot = 2;
}
message TriggerProduceReply {
    repeated RanchInfo ranches = 1;
    repeated ProduceReceipt receipts = 3;  // 本次催到的产出(可多个)
}
message ProduceReceipt {
    int64 host_gid = 1;              // 10001
    int64 slot = 2;                  // 槽位
    int64 count = 3;                 // 产出数量
    // 4..9 未出现
    ItemGain gains = 10;             // {1:物品ID, 2:数量, ...来源}
}

// --- 收获 ---
// 抓包请求: {2: 空msg, 3: 1} —— #3=1 含义待确认(推断: 收获全部)
message HarvestRanchRequest {
    // 抓包(20261117 自己牧场): 12001801 = {2:{}, 3:1} —— #2 是空 msg, 不带 gid
    HostRef host = 2;
    int64 flag = 3;                  // 抓包恒 1
}

// --- 清理好友牧场(RanchService.CleanAllRanch, 20261117 抓包) ---
// 请求: {1: 好友gid, 2:{}} (08<gid>1200); 清理产出便便(7002), 收获产物另走 HarvestRanch
// 客户端流程: EnterHomestead{1:gid,2:2} → GetRanchOpTimes → GetRanchDetail{1:gid,2:{}}
//             → CleanAllRanch{1:gid,2:{}} → LeaveHomestead{1:gid}
message CleanAllRanchRequest {
    int64 host_gid = 1;
    HostRef host = 2;
}
message CleanAllRanchReply {
    repeated RanchInfo ranches = 1;
    repeated corepb.Item gains = 2;  // 未确认(抓包响应里动物块在 #4, 便便收益结构待更多抓包)
}
message HarvestRanchReply {
    repeated RanchInfo ranches = 1;
    repeated HarvestGain gains = 5;  // 每个槽位的收获
}
message HarvestGain {
    int64 host_gid = 1;              // 10001
    int64 kind = 2;                  // 2=产物(蛋/崽), 1=整只(成年收获; 推断)
    int64 slot = 3;                  // 槽位
    // 4..9 未出现
    repeated ItemGain items = 10;    // 收获的物品(可多条: 产物 + 经验)
}

message ItemGain {
    int64 item_id = 1;               // 1060001 鸡蛋 / 2060001 整鸡 / 1102 牧场经验
    int64 count = 2;
    // 3..99 未出现
    GainSource source = 100;         // {4:{1:1007金券,2:单价}} 出售参考价
}
message GainSource {
    // 1..3 未出现
    PriceInfo price = 4;
}
message PriceInfo {
    int64 currency_id = 1;           // 1007 金券
    int64 price = 2;                 // 单价
}

message HostRef {
    // 结构未定(抓包里是空 msg), 先占位
    int64 host_gid = 1;
}

// --- 每日操作次数(RanchService.GetRanchOpTimes) ---
// 抓包响应: [{1:11003, 2:100, 4:100}, {1:11008, 2:20, 4:20}, {1:11009, 2:10, 4:10}]
// #2=今日已用, #4=上限(推测); 操作 ID 11003/11008/11009 含义待确认
message GetRanchOpTimesRequest {
    EmptyRef field1 = 1;             // 抓包: {1: 空消息}
}

message EmptyRef {}
message GetRanchOpTimesReply {
    repeated RanchOpLimit limits = 1;
}
// ⭐ 2026-11-20 抓包(20261120-001457_活动1)定案: 三个 op 的字段语义是
//   #2 = 每日上限, #3 = 今日已用, #4 = 今日剩余。
//   实测: 使坏前 {11003:#2=100,#3=1,#4=99} → 连发 15 次 PutHazard 后 {#3=16,#4=84} ✓
//         照顾前 {11009:#2=10,#3=1}        → 连发 5 次 StrokeAnimal 后 {#3=6} ✓
//   ⚠ 旧注释把 #2 写成"已用"、#4 写成"上限", 正好反了。
message RanchOpLimit {
    int64 op_id = 1;                 // 11003=使坏(PutHazard) / 11009=照顾(StrokeAnimal) / 11008=未知
    int64 limit = 2;                 // 每日上限(11003=100, 11009=10, 11008=20)
    int64 used = 3;                  // 今日已用
    int64 remaining = 4;             // 今日剩余(11008 会回 20/20 且没有 #3, 视为未参与)
}

// --- 照顾好友动物(摸一摸) AnimalService.RanchService.StrokeAnimal, 20261120 抓包 ---
// 请求: {1: 好友gid, 2:{1: 栏舍实例, 2: 槽位}}
//   ⚠ 外层 #1 是**好友 gid**(1240221153 这种), 与 PutHazard 的同构; 不是 host_gid
// 响应: {1: RanchInfo(该好友牧场全量)}, 可直接用于刷新
message StrokeAnimalRequest {
    int64 friend_gid = 1;
    AnimalTarget target = 2;         // {1: ranch_inst_id(10001/10003), 2: slot}
}
message StrokeAnimalReply {
    repeated RanchInfo ranches = 1;
}

// --- 使坏(放蚊子) RanchService.PutHazard, 20261120 抓包定案 ---
// 请求: {1: 栏舍实例(10001/10003), 2: 好友gid, 3: 11003, 4: 1}
//   ⚠ 与 StrokeAnimal **字段顺序不同**: 这里 #1 是栏舍实例, #2 才是好友 gid。
//   旧实现拼成 {1:{1:gid,2:slot}}, 服务端只会把它当成"给自己的 10001 放蚊子" → 必然失败。
// 响应: {1: 1(成功?), 2: 今日剩余次数, 3: Item(便便/蚊子), 4: Item}
message PutHazardRequest {
    int64 ranch_inst_id = 1;
    int64 friend_gid = 2;
    int64 op_id = 3;                 // 抓包恒 11003
    int64 count = 4;                 // 抓包恒 1
}
message PutHazardReply {
    int64 ok = 1;
    int64 remaining = 2;             // 今日剩余
    repeated corepb.Item gains = 3;
    repeated corepb.Item items = 4;
}
// --- 偷好友牧场产物(AnimalService.StealProduce, 20261117 抓包) ---
// 请求: {1: 好友gid} (08<gid>); 仅当好友牧场 GetRanchDetail 显示有可偷产物时客户端才发
// 响应: {1: 好友牧场 RanchInfo(偷后全量)}
message StealProduceRequest {
    int64 host_gid = 1;
}
message StealProduceReply {
    repeated RanchInfo ranches = 1;
}

// ============ 栏舍动物操作(2026-11-17 文档 + RPC 探测确认) ============
// 官方文档见 docs/mc-ranch/栏舍动物交互界面功能文档.md
// AnimalTarget: 指定动物(host_gid + slot); 空=全场

message AnimalTarget {
    int64 host_gid = 1;
    int64 slot = 2;                   // 0 = 全场
}

// 幼崽入栏: 背包幼崽 → 指定栏舍空位
// ⭐ 2026-11-18 抓包(20261118-165223_入栏)定案:
//   真实请求 = {1: {1: host_gid, 2: cub_item_id}}
//   幼崽 id 放在 target 的 **#2**(AnimalTarget.slot 的位置), 没有 #2/#3 字段!
//   一次只放一只, 连续入栏就是连续发多个请求(客户端抓包里连发 4 条)。
//   旧定义 {target, cub_item_id, count} 是错的 —— 服务端看到 cub_item_id=0
//   会拒绝(1045205)。
message PlaceAnimalRequest {
    AnimalTarget target = 1;   // {1: host_gid, 2: cub_item_id(幼崽物品id)}
}
message PlaceAnimalReply {
    repeated RanchInfo ranches = 1;
}

// 收取副产品(≠HarvestRanch 一键收获; 这是单槽"收走产物但动物留栏")
message CollectProduceRequest {
    AnimalTarget target = 1;
    int64 count = 2;
}
message CollectProduceReply {
    repeated RanchInfo ranches = 1;
    repeated HarvestGain gains = 5;
}

// 收获出栏(动物成熟后整只收走, 栏位空出)
message HarvestAnimalRequest {
    AnimalTarget target = 1;
}
message HarvestAnimalReply {
    repeated RanchInfo ranches = 1;
    repeated HarvestGain gains = 5;
}

// 出售动物(DonateAnimal): 把栏里的动物卖掉换金券
message DonateAnimalRequest {
    AnimalTarget target = 1;
}
message DonateAnimalReply {
    repeated RanchInfo ranches = 1;
    repeated corepb.Item gains = 2;
}

// 清理单个 hazard(蚊子/杂草等); CleanAllRanch 是全场版
message CleanRanchRequest {
    AnimalTarget target = 1;
}
message CleanRanchReply {
    repeated RanchInfo ranches = 1;
}
