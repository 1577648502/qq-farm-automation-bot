syntax = "proto3";

package gamepb.illustratedpb;

import "corepb.proto";

message GetIllustratedListV2Request {
    bool refresh = 1;
    // ⭐ 2026-11-20 抓包定案: #2 不是 bool, 而是**图鉴类别**(varint)。
    //   · 发 {1:0, 2:1} (08001001)  → 222 条: 农场植物/花卉图鉴
    //   · 发 {2:101}    (1065)      → 28 条: id 2060001~2070012 = **牧场动物图鉴**
    //     (牧场图鉴页的「巨大」页签; 条目 id 是成品动物 id)
    //   旧定义写成 bool, 发 101 会被编码成 1, 永远只能拿到植物图鉴。
    int64 list_type = 2;   // 1=农场植物图鉴(默认); 101=牧场动物图鉴
}

// 图鉴条目奖励 (抓包实测: field6 为嵌套消息 {item_id, count})
message IllustratedReward {
    int64 item_id = 1;
    int64 count = 2;
}

// 抓包实测字段布局:
//   1 seed_id, 2 unlock_status(品质/档位 1-4, 对应领奖阈值 10/40/80/200),
//   3 planted(已解锁/种植过), 4 planted_count(领奖所需收获数, 未解锁为 0),
//   5 harvest_count(收获数), 6 reward(嵌套), 7 has_reward(奖励已领取)
message IllustratedItem {
    int64 seed_id = 1;
    int32 unlock_status = 2;
    bool planted = 3;
    int32 planted_count = 4;
    int32 harvest_count = 5;
    IllustratedReward reward = 6;
    bool has_reward = 7;
}

message GetIllustratedListV2Reply {
    repeated IllustratedItem items = 1;
}

message ClaimAllRewardsV2Request {
    // ⭐ 2026-11-20 抓包(20261120-232455_领奖励)定案: #1 不是 bool, 是**图鉴类别**!
    //   官方客户端领「巨大」页签(牧场动物图鉴)发的是 0865 = {1:101};
    //   领植物图鉴应是 {1:1}。旧定义 bool only_claimable 是错的 ——
    //   发 true 编码成 {1:1} 恰好等于 list_type=1, 所以植物图鉴能领,
    //   而牧场动物图鉴(101)从来没被领过。
    //   (服务端按类别领取; 只有可领的会返回奖励, 无需单独的 only_claimable 位)
    int64 list_type = 1;   // 1=农场植物图鉴(默认); 101=牧场动物图鉴
}

message ClaimAllRewardsV2Reply {
    repeated corepb.Item items = 1;
    repeated corepb.Item bonus_items = 4;
}

message IllustratedRewardRedDotNotifyV2 {}

// ===== 巨大图鉴总奖励(牧场重量分档位奖励) =====
// 2026-11-22 抓包(20261120-232455_领奖励)定案。官方客户端流程:
//   PlayerSceneLogin{1:2} 切牧场场景 → GetRanchWeightScoreV2(空 body)
//   → 对 tiers 中 claimable=1 的档逐个 ClaimRanchWeightScoreRewardV2 {1:档号}
// 响应: {1:当前重量分, 2:2, 3:1, 4:repeated 各档}
//   每档: {1:档号, 2:所需重量分, 3:repeated 奖励{1:itemId,2:count}, 4:1=当前可领}
//   #4 领完即消失(下一次查询该档不再返回), 这就是"已领"判定, 无需客户端记状态。
// 实测档位表: 所需分 20/40/60/90/120/160/200/250/310/380/... 递增;
//   档1 奖励 = 点券(1002)×300 + 物品80023×5。
message GetRanchWeightScoreV2Request {}

message RanchWeightReward {
    int64 item_id = 1;
    int64 count = 2;
}

message RanchWeightTier {
    int32 tier = 1;               // 档位号(1 起)
    int32 required_score = 2;     // 该档所需重量分
    repeated RanchWeightReward rewards = 3;
    int32 claimable = 4;          // 1=当前可领(重量分达标且未领)
}

message GetRanchWeightScoreV2Reply {
    int32 score = 1;              // 当前重量分
    int32 tier_count = 2;         // 观测恒=2, 含义未定(保留)
    int32 unknown3 = 3;           // 观测恒=1, 含义未定(保留)
    repeated RanchWeightTier tiers = 4;
}

message ClaimRanchWeightScoreRewardV2Request {
    int32 tier = 1;               // 要领取的档位号
}

// 抓包实测回显 wire = 120101 = {1:[奖励们], 2:[1]} —— #2 是 **packed repeated int32**
// (档号列表, 长度前缀包裹), 不是嵌套消息也不是标量; 标量编码会是 1001。
message ClaimRanchWeightScoreRewardV2Reply {
    repeated RanchWeightReward rewards = 1;
    repeated int32 claimed = 2;   // 本次领取的档位号(packed)
}
