syntax = "proto3";

package gamepb.mallpb;

import "corepb.proto";

// 商场服务
service MallService {
  rpc GetMallListBySlotType(GetMallListBySlotTypeRequest) returns (GetMallListBySlotTypeResponse);
  rpc Purchase(PurchaseRequest) returns (PurchaseResponse);
  rpc GetMonthCardInfos(GetMonthCardInfosRequest) returns (GetMonthCardInfosReply);
  rpc ClaimMonthCardReward(ClaimMonthCardRewardRequest) returns (ClaimMonthCardRewardReply);
}

// 获取商场列表请求
message GetMallListBySlotTypeRequest {
  int32 slot_type = 1;  // 商场类型
}

// 获取商场列表响应
message GetMallListBySlotTypeResponse {
  repeated bytes goods_list = 1;  // 商品列表（每个是序列化的MallGoods）
  int64 timestamp = 2;  // 时间戳
}

// 商品信息
// 抓包(2026-09-10)修正: 旧定义把 discount 放在 field 10, 实测折扣串在 field 9,
// 而 field 10 是 varint(1/2)。字段错位会让新商品(1041+, 含打折的时装/礼包)解码抛
// "invalid wire type 7" 被静默丢弃, 表现为商城只显示老商品。
message MallGoods {
  int64 goods_id = 1;        // 商品ID
  string name = 2;           // 商品名称
  int64 type = 3;            // 商品类型
  repeated bytes item_ids = 4;  // 物品列表（每条为 {id=1, count=2} 子消息, 可多条）
  bytes price = 5;           // 价格（{id=1, count=2} 子消息, id 为货币物品ID）
  bool is_free = 6;          // 是否免费
  bytes limit = 7;           // 限购信息: { #1: 周期(1=每日, 4=总计), #2: 已购数量(0 时不下发), #3: 限购数量 }
                             //   实测: 中级/高级挑战书 {1,3}=每日2 · 20小时化肥 {1,3}=每日10 ·
                             //         每日福利 {1,2,3}=每日1已购1 · 时装礼包 {4,3}=总计1 · 无 #7=不限购
  bool is_limited = 8;       // 是否限购
  string discount = 9;       // 折扣信息 (实测 "8.8折"/"7.4折", 空串=无折扣)
  int64 field10 = 10;        // 实测 1/2, 含义未确认
  int64 field11 = 11;        // 实测 1791820799 (疑似上架时间)
  int64 field12 = 12;        // 实测 1/2, 含义未确认
  string image = 13;         // 商品图路径 (gui/texture/Season/S3/...)
  int64 field14 = 14;        // 实测 428, 含义未确认
  int64 field15 = 15;        // 实测 int64 负数(时间戳占位)
  int64 field16 = 16;        // 实测 int64 负数(时间戳占位)
}

// 购买请求
message PurchaseRequest {
  int32 goods_id = 1;  // 商品ID
  int32 count = 2;     // 购买数量
}

// 购买响应
message PurchaseResponse {
  int32 goods_id = 1;     // 商品ID
  int32 count = 2;        // 购买数量
  bytes reward_info = 3;  // 奖励信息
  bytes result = 5;       // 购买结果
}

// 月卡信息
message GetMonthCardInfosRequest {}

message MonthCardInfo {
  int32 goods_id = 1;
  corepb.Item reward = 2;
  bool can_claim = 3;
}

message GetMonthCardInfosReply {
  repeated MonthCardInfo infos = 1;
}

// 领取月卡奖励
message ClaimMonthCardRewardRequest {
  int32 goods_id = 1;
}

message ClaimMonthCardRewardReply {
  repeated corepb.Item items = 1;
}
